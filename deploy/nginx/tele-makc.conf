# Reverse proxy for Next.js + FastAPI (Docker on 127.0.0.1)
# Place: /etc/nginx/sites-available/tele-makc.ru → symlink sites-enabled
#
# Канонический хост — без www (как в YML-фиде и NEXT_PUBLIC_SITE_URL).
# www.tele-makc.ru только редиректит на tele-makc.ru, чтобы в поиске не было дублей.

# HTTP → HTTPS (оба имени; после редиректа www попадёт на HTTPS с www — см. блок ниже)
server {
    listen 80;
    listen [::]:80;
    server_name tele-makc.ru www.tele-makc.ru;
    return 301 https://$host$request_uri;
}

# www → канонический домен (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tele-makc.ru;

    ssl_certificate /etc/letsencrypt/live/tele-makc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tele-makc.ru/privkey.pem;

    return 301 https://tele-makc.ru$request_uri;
}

# Основной сайт (только tele-makc.ru)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tele-makc.ru;

    ssl_certificate /etc/letsencrypt/live/tele-makc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tele-makc.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 50m;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
